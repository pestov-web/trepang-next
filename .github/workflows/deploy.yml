name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trepang-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: [self-hosted, Linux, X64, trepang]
    timeout-minutes: 20
    env:
      APP_ROOT: /home/mwk/trepang-production
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Activate Node.js 24 and pnpm
        run: |
          eval "$($HOME/.local/share/fnm/fnm env --shell bash)"
          fnm use 24
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"
          node --version
          pnpm --version

      - name: Create release
        id: release
        run: |
          release="$APP_ROOT/releases/$GITHUB_SHA-$GITHUB_RUN_ID"
          mkdir -p "$release" "$APP_ROOT/shared/data" "$APP_ROOT/shared/uploads"
          rsync -a --delete \
            --exclude .git \
            --exclude .next \
            --exclude node_modules \
            --exclude data \
            --exclude public/uploads \
            "$GITHUB_WORKSPACE/" "$release/"
          mkdir -p "$release/data" "$release/public/uploads"
          cp "$APP_ROOT/shared/.env.production" "$release/.env.production"
          echo "path=$release" >> "$GITHUB_OUTPUT"

      - name: Install, lint and build
        working-directory: ${{ steps.release.outputs.path }}
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Switch release
        env:
          RELEASE_PATH: ${{ steps.release.outputs.path }}
        run: |
          cp -an "$RELEASE_PATH/data/." "$APP_ROOT/shared/data/"
          find "$RELEASE_PATH/data" -mindepth 1 -delete
          find "$RELEASE_PATH/public/uploads" -mindepth 1 -delete
          rmdir "$RELEASE_PATH/data" "$RELEASE_PATH/public/uploads"
          ln -s "$APP_ROOT/shared/data" "$RELEASE_PATH/data"
          ln -s "$APP_ROOT/shared/uploads" "$RELEASE_PATH/public/uploads"
          unlink "$RELEASE_PATH/.env.production"
          ln -s "$APP_ROOT/shared/.env.production" "$RELEASE_PATH/.env.production"
          ln -sfn "$RELEASE_PATH" "$APP_ROOT/current"
          cd "$RELEASE_PATH"
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

      - name: Verify application
        run: curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3333/ >/dev/null
